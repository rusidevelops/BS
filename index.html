<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue_Screen</title>

<style>
body {
    background: #0078D7;
    color: white;
    font-family: "Segoe UI", sans-serif;
    user-select: none;
    margin: 0;
    padding-left: 100px;
    padding-top: 40px;
    text-wrap: pretty;
}

.bsod {
    width: 80%;
}

.smiley_face {
    font-size: 120px;
    margin: 0;
}

.info {
    font-size: 21px;
    max-width: 700px;
    line-height: 1.4;
}

span {
    font-size: 28px;
}

sub {
    display: block;
    margin-top: 50px;
    font-size: 16px;
}

a {
    color: white;
}

.ad {
    background: rgb(62, 62, 215);
    color: white;
    height: 170px;
    width: 310px;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 3px solid rgb(37, 37, 119);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    position: fixed;
    animation: appear 0.4s ease;
}

.ad p {
    font-size: 23px;
    font-weight: bold;
}

.download {
    color: white;
    background: #0059ff;
    border: 2px solid #00aaff;
    border-radius: 10px;
    width: 200px;
    height: 50px;
    font-size: 18px;
    cursor: pointer;
}

.download:hover {
    background: #00aaff;
}

@keyframes appear {
    from {
        transform: scale(0);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}
</style>
</head>

<body>

<div class="bsod">

<p class="smiley_face">:)</p>

<p class="info">
Your PC ran into a problem and needs to restart.
We're just collecting some error info, and then we'll restart for you.
</p>

<span>67% complete</span>

<sub>
For more info about the issue and possible fixes, visit my
<a href="https://github.com/rusidevelops" target="_blank" rel="noopener noreferrer">GitHub</a>.
</sub>

<sub>
Stop code: 67x67676767
</sub>

</div>

<script>
let ads = [];

function createAd() {
    let ad = document.createElement("div");

    ad.className = "ad";

    ad.innerHTML = `
        <p>100% free RAM!</p>
        <a href="https://github.com/rusidevelops" target="_blank">
            <button class="download">Download</button>
            </a>
        
    `;

    let x = Math.random() * (window.innerWidth - 310);
    let y = Math.random() * (window.innerHeight - 170);

    ad.style.left = x + "px";
    ad.style.top = y + "px";

    document.body.appendChild(ad);
    ads.push(ad);

    setTimeout(() => {
        ad.remove();
        ads = ads.filter(item => item !== ad);
    }, 4000);
}

setInterval(createAd, 400);
</script>

</body>
</html>
